<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>MPGS Debug</title>

    <script
      src="https://rakbankpay-nam.gateway.mastercard.com/static/checkout/checkout.min.js"
      data-error="onCheckoutError"
      data-cancel="onCheckoutCancel"
    ></script>
<script>
  function onCheckoutError(err) {
    console.error("❌ Checkout ERROR:", err);
    alert("Checkout error:\n" + JSON.stringify(err, null, 2));
  }

  function onCheckoutCancel() {
    console.warn("⚠️ Checkout cancelled by user");
    alert("Checkout cancelled");
  }

  function start() {
    console.log("🚀 Starting MPGS checkout");
    console.log("SESSION_ID =", "{{SESSION_ID}}");
    console.log("RETURN_URL =", "{{RETURN_URL}}");

    if (!window.Checkout) {
      console.error("❌ Checkout.js NOT loaded");
      alert("Checkout.js not loaded");
      return;
    }

    try {
      Checkout.configure({
        session: {
          id: "{{SESSION_ID}}",
        },
        interaction: {
          redirect: {
            returnUrl: "{{RETURN_URL}}",
          },
        },
      });

      console.log("✅ Checkout.configure OK");
      Checkout.showPaymentPage();
      console.log("➡️ Checkout.showPaymentPage called");
    } catch (e) {
      console.error("❌ Exception during checkout:", e);
      alert("Exception: " + e.message);
    }
  }
</script>

  </head>

  <body onload="start()">
    <h3>Debugging MPGS checkout…</h3>
  </body>
</html>
