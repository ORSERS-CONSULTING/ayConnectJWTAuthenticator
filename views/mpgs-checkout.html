<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting to Secure Payment</title>

    <script
      src="https://rakbankpay-nam.gateway.mastercard.com/static/checkout/checkout.min.js"
      data-error="onCheckoutError"
      data-cancel="onCheckoutCancel"
    ></script>

    <script>
      function onCheckoutError(err) {
        console.error("MPGS checkout error", err);
      }

      function onCheckoutCancel() {
        console.log("MPGS checkout cancelled");
      }

      function waitForCheckoutAndStart() {
        if (
          window.Checkout &&
          typeof window.Checkout.configure === "function"
        ) {
          Checkout.configure({
            session: {
              id: "{{SESSION_ID}}",
            },
          });
          Checkout.showPaymentPage();
        } else {
          // ⏳ IMPORTANT: retry until Checkout.js is ready
          setTimeout(waitForCheckoutAndStart, 50);
        }
      }
    </script>
  </head>

  <body
    onload="waitForCheckoutAndStart()"
    style="
      background: #f5f8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: system-ui, sans-serif;
    "
  >
    <p>Redirecting to secure payment…</p>
  </body>
</html>
