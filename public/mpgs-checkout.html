<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Secure Payment</title>

    <script src="https://rakbankpay-nam.gateway.mastercard.com/static/checkout/checkout.min.js"></script>
  </head>

  <body>
    <script>
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get("sessionId");

      Checkout.configure({
        session: {
          id: sessionId,
        },
        interaction: {
          returnUrl: "https://ameryon.com/payments/return",
        },
      });

      Checkout.showPaymentPage();
    </script>
  </body>
</html>
